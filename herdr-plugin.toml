id = "worktable"
name = "Worktable"
version = "0.1.0"
min_herdr_version = "0.9.5"
description = "Tasks, tickets, merge requests, worktrees and agents in one table"
platforms = ["linux", "macos"]

[[build]]
command = ["cargo", "build", "--release", "--locked"]

[[actions]]
id = "open"
title = "Open worktable"
contexts = ["workspace"]
command = ["./target/release/wt", "plugin-open"]

[[startup]]
command = ["sh", "scripts/metadata.sh"]

[[actions]]
id = "metadata"
title = "Update sidebar metadata"
contexts = ["workspace"]
command = ["sh", "scripts/metadata.sh"]

[[panes]]
id = "board"
title = "Worktable"
placement = "popup"
width = "90%"
height = "90%"
command = ["sh", "scripts/popup.sh"]
