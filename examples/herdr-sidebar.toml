# Merge these sections into Herdr's config.toml, then reload config.
[ui.sidebar.agents]
rows = [
    ["state_icon", "machine", "agent", { token = "$wt_cli", dim = true }, { token = "$wt_workspace", dim = true }, "$wt_role", { token = "$wt_ci", rules = [{ equals = "CI ✓", fg = "#9ece6a" }, { equals = "CI ✗", fg = "#f7768e" }, { equals = "CI ↻", fg = "#e0af68" }] }],
    ["$wt_state", { token = "$wt_review", fg = "#e0af68" }],
]

[ui.sidebar.spaces]
rows = [
    ["state_icon", "workspace", { token = "$wt_project", dim = true }],
    ["$wt_state", { token = "$wt_ci", rules = [{ equals = "CI ✓", fg = "#9ece6a" }, { equals = "CI ✗", fg = "#f7768e" }, { equals = "CI ↻", fg = "#e0af68" }] }, { token = "$wt_review", fg = "#e0af68" }],
]
